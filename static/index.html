<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pyMusicGPT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">🎵 pyMusicGPT</span>
        <button class="icon-btn" id="newChatBtn" title="New chat">＋</button>
      </div>

      <div class="session-list" id="sessionList">
        <!-- sessions injected by JS -->
      </div>

      <div class="sidebar-footer">
        <div id="metricsContainer" class="metrics" role="group" aria-label="System usage">
          <span class="metric" id="metric-cpu" data-level="na"><span class="metric-label">CPU</span> <span class="metric-value">–</span></span>
          <span class="metric" id="metric-gpu" data-level="na"><span class="metric-label">GPU</span> <span class="metric-value">–</span></span>
          <span class="metric" id="metric-ram" data-level="na"><span class="metric-label">RAM</span> <span class="metric-value">–</span></span>
        </div>
        <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
      </div>
    </aside>

    <!-- Main panel -->
    <main class="main">
      <div class="topbar">
        <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar">☰</button>
        <span class="session-title" id="sessionTitle">Select or create a chat</span>
      </div>

      <!-- Card table: docked deck on top, played cards (generated tracks) below -->
      <div class="messages" id="messages">
        <section class="deck-dock" id="deckDock" aria-label="Card decks">
          <div class="dock-head">
            <div class="dock-tabs" role="tablist" aria-label="Deck">
              <button type="button" class="dock-tab" role="tab" id="tabIdeas" data-tab="ideas" aria-controls="dockIdeas" aria-selected="true">💡 Ideas</button>
              <button type="button" class="dock-tab" role="tab" id="tabBuild" data-tab="build" aria-controls="dockBuild" aria-selected="false" tabindex="-1">🧩 Build</button>
            </div>
            <button type="button" class="dock-toggle" id="dockToggle" aria-expanded="true" aria-controls="dockBody">▾ Hide</button>
          </div>
          <div class="dock-body" id="dockBody">
            <div role="tabpanel" id="dockIdeas" aria-labelledby="tabIdeas"></div>
            <div role="tabpanel" id="dockBuild" aria-labelledby="tabBuild" hidden></div>
          </div>
        </section>

        <div class="played-head" id="playedHead" hidden>Played cards</div>
        <div class="played-grid" id="playedGrid"></div>
        <p class="played-empty" id="playedEmpty">Draw a card or type a prompt, then hit <strong>Generate</strong> — your tracks land here as played cards.</p>
      </div>

      <!-- Input bar -->
      <form class="input-bar" id="promptForm">
        <div class="duration-control">
          <label for="durationInput">Duration (s)</label>
          <input type="number" id="durationInput" min="1" max="600" value="10" />
        </div>
        <button type="button" class="icon-btn deck-open-btn" id="deckBtn" title="Show the deck and deal" aria-label="Show the deck and deal">🃏</button>
        <input
          type="text"
          id="promptInput"
          class="prompt-input"
          placeholder="Describe the music you want…"
          autocomplete="off"
          required
        />
        <button type="submit" class="send-btn" id="sendBtn">Generate</button>
      </form>
    </main>
  </div>

  <script src="ideas.js"></script>
  <script src="app.js"></script>
</body>
</html>
